name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

# A newer push to the same PR supersedes the run still in progress; main and scheduled runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-26.04  # Pinned; move it together with Playwright, whose browsers support a fixed set of OS releases (HC-007)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install AST dependencies for Java integration tests
        run: npm --prefix screentrace-js ci --ignore-scripts
      - name: Build standalone viewer
        run: |
          npm --prefix screentrace-viewer ci --ignore-scripts
          npm --prefix screentrace-viewer run build
      # TypeScript / JavaScript must match Prettier (HC-001); run `npm --prefix screentrace-viewer run format` to fix.
      - name: Check TypeScript and JavaScript formatting
        run: npm --prefix screentrace-viewer run format:check
      # JavaScript must pass ESLint's recommended rules (HC-001, ADR 0140); TypeScript is checked by
      # `tsc` in the viewer build above (strict, noUnusedLocals, noUnusedParameters).
      - name: Lint JavaScript
        run: npm --prefix screentrace-viewer run lint
      - name: Install capture dependencies
        run: npm --prefix screentrace-capture ci
      - name: Install viewer test browsers
        run: npm exec --prefix screentrace-capture -- playwright install --with-deps chromium firefox webkit
      # Java sources must match google-java-format (HC-001); run `./mvnw com.diffplug.spotless:spotless-maven-plugin:apply` to fix.
      - name: Check Java formatting
        run: ./mvnw -B com.diffplug.spotless:spotless-maven-plugin:check
      # -Pcoverage adds a JaCoCo report per module (HC-003); it is reported, not enforced.
      - name: Build and test Java modules
        run: ./mvnw -B clean verify -Pcoverage
      - name: Summarize Java test coverage
        if: always()
        shell: bash
        run: |
          {
            echo "### Java test coverage (each module's own tests)"
            echo "| Module | Lines | Branches |"
            echo "|---|---:|---:|"
            for csv in */target/site/jacoco/jacoco.csv; do
              [ -f "$csv" ] || continue
              awk -F, -v m="${csv%%/*}" 'NR > 1 { bm += $6; bc += $7; lm += $8; lc += $9 }
                END { printf "| %s | %.1f%% (%d/%d) | %.1f%% |\n", m, 100 * lc / (lm + lc), lc, lm + lc, (bm + bc) ? 100 * bc / (bm + bc) : 0 }' "$csv"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Java coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-coverage
          path: '*/target/site/jacoco/'
          if-no-files-found: warn
      - name: Test file viewer in all engines
        env:
          ST_BROWSERS: chromium,firefox,webkit
        run: node --test screentrace-viewer/test/*.e2e.mjs

  # The Windows launcher and Windows paths (drive letters, backslashes, case-insensitive names) had no CI (HC-003).
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      # Fixtures and golden files are compared byte for byte, so keep their line endings as committed.
      - name: Keep line endings unchanged
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies and build the viewer
        run: |
          npm --prefix screentrace-js ci --ignore-scripts
          npm --prefix screentrace-viewer ci --ignore-scripts
          npm --prefix screentrace-viewer run build
          npm --prefix screentrace-capture ci
          npm exec --prefix screentrace-capture -- playwright install chromium
      - name: Build and test Java modules
        run: .\mvnw.cmd -B clean verify
      - name: Analyze a fixture with the Windows launcher
        run: |
          Copy-Item -Recurse fixtures\struts "$env:RUNNER_TEMP\struts"
          .\bin\screentrace.cmd analyze "$env:RUNNER_TEMP\struts"
          if ($LASTEXITCODE -ne 0) { throw "Analysis exited with $LASTEXITCODE" }
          $report = 'analyze\struts\report\screentrace-report.html'
          if (-not (Test-Path $report)) { throw 'The report was not written' }
          foreach ($local in @($env:RUNNER_TEMP, $env:RUNNER_TEMP.Replace('\', '\\'), $env:RUNNER_TEMP.Replace('\', '/'))) {
            if (Select-String -Path $report -SimpleMatch -Quiet $local) { throw 'The report contains a local path' }
          }

  dependency-audit:
    runs-on: ubuntu-26.04  # Pinned; move it together with Playwright, whose browsers support a fixed set of OS releases (HC-007)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Set vulnerability cache date
        id: cache-date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore vulnerability database
        id: vulnerability-cache
        # The split restore action exposes cache-matched-key; the combined actions/cache does not.
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          # Isolate the scanner's database schema from previous plugin versions.
          key: ${{ runner.os }}-dependency-check-12.2.2-${{ steps.cache-date.outputs.day }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-12.2.2-
      - name: Audit Java dependencies
        id: audit
        shell: bash
        env:
          DEPENDENCY_CHECK_DATA: ${{ runner.temp }}/dependency-check-data
          CACHED_KEY: ${{ steps.vulnerability-cache.outputs.cache-matched-key }}
        # Package in the same invocation so the reactor modules resolve without a full test run.
        # Only a failed NVD feed update is retried; a vulnerability above the threshold fails at once.
        # If the NVD feed stays down, the audit runs once on the restored database when it is at most a week old.
        # database-updated=true only when the feed update completed, so a stale database is never saved under a newer date.
        run: |
          log="$RUNNER_TEMP/dependency-audit.log"
          audit() {
            ./mvnw -B -DskipTests package org.owasp:dependency-check-maven:aggregate -DdataDirectory="$DEPENDENCY_CHECK_DATA" "$@" 2>&1 | tee "$log"
          }
          vulnerable() {
            grep -q 'CVSS score greater than or equal to' "$log"
          }
          feed_failed() {
            ! vulnerable &&
              grep -qE 'Error downloading NVD|DownloadFailedException|UpdateException|Unable to download & parse the data feed' "$log"
          }
          for attempt in 1 2 3; do
            if audit; then
              echo "database-updated=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if vulnerable; then
              echo "database-updated=true" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            feed_failed || exit 1
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::NVD feed update failed on attempt $attempt; retrying"
              sleep $((attempt * 60))
            fi
          done
          cached_day="${CACHED_KEY##*-dependency-check-12.2.2-}"
          if [ -z "$CACHED_KEY" ] || ! cached_at=$(date -u -d "$cached_day" +%s 2>/dev/null); then
            echo "::error::NVD feed update failed and no vulnerability database was restored"
            exit 1
          fi
          age_days=$(( ($(date -u +%s) - cached_at) / 86400 ))
          if [ "$age_days" -gt 7 ]; then
            echo "::error::NVD feed update failed and the restored vulnerability database from $cached_day is older than a week"
            exit 1
          fi
          echo "::warning::NVD feed update failed three times; auditing with the vulnerability database from $cached_day"
          audit -DautoUpdate=false
      - name: Save vulnerability database
        # Also saves when the audit fails on a vulnerability, since the database was still updated.
        # A fallback run reuses the restored database unchanged, which keeps its original date key.
        if: always() && steps.audit.outputs.database-updated == 'true' && steps.vulnerability-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: ${{ steps.vulnerability-cache.outputs.cache-primary-key }}
      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-dependency-audit
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn

  node-dependency-audit:
    runs-on: ubuntu-26.04  # Pinned; move it together with Playwright, whose browsers support a fixed set of OS releases (HC-007)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            screentrace-capture/package-lock.json
            screentrace-js/package-lock.json
            screentrace-viewer/package-lock.json
      - name: Install Node dependencies
        run: npm --prefix screentrace-capture ci
      - name: Install Chromium for static reconstruction tests
        run: npm exec --prefix screentrace-capture -- playwright install --with-deps chromium
      # react-preview-state.test.mjs runs the React analyzer, so its parser dependencies must be installed first.
      - name: Install JavaScript parser dependencies
        run: npm --prefix screentrace-js ci --ignore-scripts
      # Run every capture test file; a hand-kept list left seven files unrun (HC-003).
      - name: Test static capture and project documentation
        run: node --test screentrace-capture/*.test.mjs
      - name: Audit Node dependencies
        run: npm --prefix screentrace-capture audit --audit-level=high
      - name: Test and audit standalone viewer build
        run: |
          npm --prefix screentrace-viewer ci --ignore-scripts
          npm --prefix screentrace-viewer run build
          npm --prefix screentrace-viewer test
          npm --prefix screentrace-viewer audit --audit-level=high
      - name: Test JavaScript parser
        run: npm --prefix screentrace-js test
      - name: Audit JavaScript parser dependencies
        run: npm --prefix screentrace-js audit --audit-level=high
