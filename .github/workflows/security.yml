name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

# A newer push to the same PR supersedes the run still in progress; main and scheduled runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install AST dependencies for Java integration tests
        run: npm --prefix screentrace-js ci --ignore-scripts
      - name: Build standalone viewer
        run: |
          npm --prefix screentrace-viewer ci --ignore-scripts
          npm --prefix screentrace-viewer run build
      - name: Install capture dependencies
        run: npm --prefix screentrace-capture ci
      - name: Install viewer test browsers
        run: npm exec --prefix screentrace-capture -- playwright install --with-deps chromium firefox webkit
      - name: Build and test Java modules
        run: mvn -B clean verify
      - name: Test file viewer in all engines
        env:
          ST_BROWSERS: chromium,firefox,webkit
        run: node --test screentrace-viewer/test/*.e2e.mjs

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Set vulnerability cache date
        id: cache-date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore vulnerability database
        id: vulnerability-cache
        # The split restore action exposes cache-matched-key; the combined actions/cache does not.
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          # Isolate the scanner's database schema from previous plugin versions.
          key: ${{ runner.os }}-dependency-check-12.2.2-${{ steps.cache-date.outputs.day }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-12.2.2-
      - name: Audit Java dependencies
        id: audit
        shell: bash
        env:
          DEPENDENCY_CHECK_DATA: ${{ runner.temp }}/dependency-check-data
          CACHED_KEY: ${{ steps.vulnerability-cache.outputs.cache-matched-key }}
        # Package in the same invocation so the reactor modules resolve without a full test run.
        # Only a failed NVD feed update is retried; a vulnerability above the threshold fails at once.
        # If the NVD feed stays down, the audit runs once on the restored database when it is at most a week old.
        # database-updated=true only when the feed update completed, so a stale database is never saved under a newer date.
        run: |
          log="$RUNNER_TEMP/dependency-audit.log"
          audit() {
            mvn -B -DskipTests package org.owasp:dependency-check-maven:aggregate -DdataDirectory="$DEPENDENCY_CHECK_DATA" "$@" 2>&1 | tee "$log"
          }
          vulnerable() {
            grep -q 'CVSS score greater than or equal to' "$log"
          }
          feed_failed() {
            ! vulnerable &&
              grep -qE 'Error downloading NVD|DownloadFailedException|UpdateException|Unable to download & parse the data feed' "$log"
          }
          for attempt in 1 2 3; do
            if audit; then
              echo "database-updated=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if vulnerable; then
              echo "database-updated=true" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            feed_failed || exit 1
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::NVD feed update failed on attempt $attempt; retrying"
              sleep $((attempt * 60))
            fi
          done
          cached_day="${CACHED_KEY##*-dependency-check-12.2.2-}"
          if [ -z "$CACHED_KEY" ] || ! cached_at=$(date -u -d "$cached_day" +%s 2>/dev/null); then
            echo "::error::NVD feed update failed and no vulnerability database was restored"
            exit 1
          fi
          age_days=$(( ($(date -u +%s) - cached_at) / 86400 ))
          if [ "$age_days" -gt 7 ]; then
            echo "::error::NVD feed update failed and the restored vulnerability database from $cached_day is older than a week"
            exit 1
          fi
          echo "::warning::NVD feed update failed three times; auditing with the vulnerability database from $cached_day"
          audit -DautoUpdate=false
      - name: Save vulnerability database
        # Also saves when the audit fails on a vulnerability, since the database was still updated.
        # A fallback run reuses the restored database unchanged, which keeps its original date key.
        if: always() && steps.audit.outputs.database-updated == 'true' && steps.vulnerability-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: ${{ steps.vulnerability-cache.outputs.cache-primary-key }}
      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-dependency-audit
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn

  node-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            screentrace-capture/package-lock.json
            screentrace-js/package-lock.json
            screentrace-viewer/package-lock.json
      - name: Install Node dependencies
        run: npm --prefix screentrace-capture ci
      - name: Install Chromium for static reconstruction tests
        run: npm exec --prefix screentrace-capture -- playwright install --with-deps chromium
      - name: Test static capture and project documentation
        run: node --test screentrace-capture/docs-baseline.test.mjs screentrace-capture/safe-files.test.mjs screentrace-capture/spring-resource-mappings.test.mjs screentrace-capture/capture-static-jsp.security.test.mjs screentrace-capture/preview-markup.test.mjs screentrace-capture/preview-v2.test.mjs screentrace-capture/pack-preview.test.mjs screentrace-capture/r6-thumbnail.test.mjs screentrace-capture/r7-anchor.test.mjs screentrace-capture/r7-reasons.test.mjs screentrace-capture/tiles-preview.test.mjs screentrace-capture/react-preview.test.mjs
      - name: Audit Node dependencies
        run: npm --prefix screentrace-capture audit --audit-level=high
      - name: Test and audit standalone viewer build
        run: |
          npm --prefix screentrace-viewer ci --ignore-scripts
          npm --prefix screentrace-viewer run build
          npm --prefix screentrace-viewer test
          npm --prefix screentrace-viewer audit --audit-level=high
      - name: Install JavaScript parser dependencies
        run: npm --prefix screentrace-js ci --ignore-scripts
      - name: Test JavaScript parser
        run: npm --prefix screentrace-js test
      - name: Audit JavaScript parser dependencies
        run: npm --prefix screentrace-js audit --audit-level=high
