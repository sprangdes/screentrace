name: Security checks

on:
  push:
  pull_request:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: screentrace-capture/package-lock.json
      - name: Audit Java dependencies
        run: mvn -B org.owasp:dependency-check-maven:12.1.0:aggregate -DfailBuildOnCVSS=7
      - name: Audit Node dependencies
        run: npm --prefix screentrace-capture ci && npm --prefix screentrace-capture audit --audit-level=high
